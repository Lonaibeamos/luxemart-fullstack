<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3 Ways to Create Charts</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    padding:20px;
}

/* =========================
   SECTION STYLE
========================= */
section{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

/* =========================
   1. CSS CHART
========================= */
.cssChart{
    display:flex;
    align-items:flex-end;
    gap:15px;
    height:200px;
}

.cssBar{
    width:60px;
    background:#2CD396;
    border-radius:8px 8px 0 0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
}

/* =========================
   2. SVG CHART
========================= */
svg{
    background:#0A1121;
    border-radius:10px;
}

.bar-svg{
    fill:#7E8CE0;
}

/* =========================
   3. CANVAS CHART
========================= */
canvas{
    max-width:500px;
}
</style>
</head>

<body>

<h1>3 Ways to Create Charts in HTML</h1>

<!-- ========================= -->
<!-- 1. CSS CHART -->
<!-- ========================= -->
<section>
<h2>1. HTML + CSS Chart (Basic)</h2>

<div class="cssChart">
    <div class="cssBar" style="height:60%">60%</div>
    <div class="cssBar" style="height:80%">80%</div>
    <div class="cssBar" style="height:40%">40%</div>
    <div class="cssBar" style="height:90%">90%</div>
</div>

<p>✔ Simple but not accurate</p>
</section>


<!-- ========================= -->
<!-- 2. SVG CHART -->
<!-- ========================= -->
<section>
<h2>2. SVG Chart (Vector based)</h2>

<svg width="400" height="200">

    <rect class="bar-svg" x="20" y="80" width="40" height="120"></rect>
    <rect class="bar-svg" x="80" y="40" width="40" height="160"></rect>
    <rect class="bar-svg" x="140" y="100" width="40" height="100"></rect>
    <rect class="bar-svg" x="200" y="20" width="40" height="180"></rect>

</svg>

<p>✔ Sharp and scalable (no blur)</p>
</section>


<!-- ========================= -->
<!-- 3. CANVAS CHART (Chart.js) -->
<!-- ========================= -->
<section>
<h2>3. Canvas Chart (Chart.js - BEST)</h2>

<canvas id="myChart"></canvas>

<p>✔ Used in real dashboards (recommended)</p>
</section>


<script>
new Chart(document.getElementById("myChart"), {
    type: "bar",
    data: {
        labels: ["Users", "Products", "Orders", "Revenue"],
        datasets: [{
            label: "Stats",
            data: [100, 50, 25, 80],
            backgroundColor: [
                "#2CD396",
                "#7E8CE0",
                "#DE7A33",
                "#10B981"
            ]
        }]
    }
});
</script>

</body>
</html>
